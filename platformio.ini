[env:esp32-c3-devkitm-1]
# Pinned: the deck's original firmware was built with ESP-IDF v4.4.5 /
# arduino-lib-builder Jun 2023 (Arduino core 2.0.x), recovered from its app
# descriptor. Unpinned this resolves to a 3.x core; src/main.cpp handles both
# esp_task_wdt_init() signatures, but the 2.0.x core is what this deck is
# known-good on, so stay there deliberately rather than by accident.
#
# Note for macOS: espressif32 6.x ships an x86_64-only riscv32 toolchain, so
# building on Apple Silicon needs Rosetta (softwareupdate --install-rosetta).
# CI builds on Linux and is unaffected.
platform = espressif32@6.4.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    links2004/WebSockets@^2.7.3
    adafruit/Adafruit NeoPixel@^1.15.5
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32