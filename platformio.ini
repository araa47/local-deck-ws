[env:esp32-c3-devkitm-1]
# Pinned: the deck's original firmware was built with ESP-IDF v4.4.5 /
# arduino-lib-builder Jun 2023 (Arduino core 2.0.x), recovered from its app
# descriptor. main's src/main.cpp calls the 2-arg esp_task_wdt_init(30, true),
# which only exists on that core; unpinned it resolves to a 3.x core where the
# API takes a config struct and the build fails.
platform = espressif32@6.4.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    links2004/WebSockets@^2.3.7
    adafruit/Adafruit NeoPixel@^1.10.7
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32