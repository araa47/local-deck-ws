[env:esp32-c3-devkitm-1]
# Pinned: the deck's original firmware was built with ESP-IDF v4.4.5 /
# arduino-lib-builder Jun 2023 (Arduino core 2.0.x), recovered from its app
# descriptor. Unpinned this resolves to a 3.x core; src/main.cpp handles both
# esp_task_wdt_init() signatures, but the 2.0.x core is what this deck is
# known-good on, so stay there deliberately rather than by accident.
#
# Note for Apple Silicon: the riscv32 toolchain this platform pins (8.4.0) is
# x86_64-only, so `pio run` fails with "Bad CPU type in executable" unless
# Rosetta is installed. To build natively instead, without Rosetta and without
# moving off the 2.0.x core, override just the toolchain locally:
#
#   platform_packages = espressif/toolchain-riscv32-esp@12.2.0+20230208
#   build_unflags = -march=rv32imc
#   build_flags = -march=rv32imc_zicsr_zifencei    ; (plus the flags below)
#
# The -march change is required because GCC 12 no longer implies the zicsr
# extension that this ESP-IDF's inline asm uses. Deliberately not applied by
# default: it would move every build, CI included, from GCC 8.4 to GCC 12.2.
platform = espressif32@6.4.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    links2004/WebSockets@^2.7.3
    adafruit/Adafruit NeoPixel@^1.15.5
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32